<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Подъёмная сила</title>
  <meta name="description" content="Интерактивная выставка: вертолёт и самолёт в 3D. Прокрутите страницу, и каждая машина развернётся к своим узлам.">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="studio" aria-hidden="true"></div>
  <canvas id="scene" aria-hidden="true"></canvas>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="callouts" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" id="brand" href="#"></a>
    <div class="hud" aria-hidden="true">
      <span id="hdg">HDG 000°</span>
      <span id="stepno"></span>
    </div>
  </header>

  <div class="intro" id="intro">
    <div class="intro__inner" id="intro-inner">
      <p class="eyebrow" id="intro-eyebrow"></p>
      <h1 class="intro__title" id="intro-title"></h1>
      <p class="intro__lead" id="intro-lead"></p>
    </div>
  </div>
  <div class="cue" id="cue" aria-hidden="true"><span id="cue-text"></span><i></i></div>

  <div id="chapters"></div>
  <div id="sheets"></div>

  <div class="outro" id="outro">
    <h2 class="outro__title" id="outro-title"></h2>
    <p class="outro__text" id="outro-text"></p>
    <button type="button" class="outro__btn" id="outro-restart"><span aria-hidden="true">↑</span><span></span></button>
    <p class="outro__note" id="outro-note"></p>
  </div>

  <footer class="dock">
    <nav class="parts" id="parts" aria-label="Узлы машины"></nav>
    <div class="progress" aria-hidden="true"><i id="progress-fill"></i></div>
  </footer>

  <main class="track" id="track"></main>

  <div class="fallback">
    <p>Для 3D-моделей нужен браузер с поддержкой WebGL и включённым JavaScript.</p>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
